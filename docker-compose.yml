services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prospector
      POSTGRES_PASSWORD: prospector
      POSTGRES_DB: prospector
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospector"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://prospector:prospector@db:5432/prospector
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      # Em produção (ex: Easypanel), defina as duas abaixo pra exigir login
      # (usuário/senha compartilhados do time) antes de acessar o app. Sem
      # elas, o app fica aberto — ok em dev local, não em produção.
      # BASIC_AUTH_USER: equipe
      # BASIC_AUTH_PASSWORD: troque-isso
    depends_on:
      - backend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
